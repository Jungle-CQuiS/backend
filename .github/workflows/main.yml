# workflow name
name: Github Actions CI/CD

# Event: when the workflow will run
# workflow runs on push events to the main branch
on:
  push:
    branches:
      - develop

# workflow consists of more than one job
# multiple jobs run in parallel
jobs:
  # id to identify job
  Deploy:
    # type of runner(lastest version of ubuntu)
    runs-on: ubuntu-latest

    # step: a task that can run commands
    # steps to run in the job
    steps:
      - name: Github Repository에 올린 파일들을 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch entire history
          submodules: true # including submodules

      - name: JDK 17 버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: application.yml 파일 만들기
        run: |
          mkdir -p ./src/test/resources
          cp ./src/main/resources/application.yml ./src/test/resources/
          cp ./src/main/resources/application-openvidu.yml ./src/test/resources/

      - name: YAML 구조 검증
        run: |
          echo "=== YAML Structure Check ==="
          python3 <<EOF
          import yaml
          try:
              with open('./src/test/resources/application-openvidu.yml', 'r') as f:
                  data = yaml.safe_load(f)
                  print("Loaded YAML structure:")
                  print(f"Top level keys: {list(data.keys() if data else [])}")
                  if data and 'openvidu' in data:
                      print("openvidu section exists")
                      openvidu_data = data['openvidu']
                      print(f"openvidu keys: {list(openvidu_data.keys() if openvidu_data else [])}")
                  else:
                      print("No openvidu section found!")
          except Exception as e:
              print(f"Error parsing YAML: {str(e)}")
          EOF
          
      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: 빌드된 파일 이름 변경하기
        run: mv ./build/libs/*SNAPSHOT.jar ./project.jar

      - name: SCP로 EC2에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.jar
          target: /home/ubuntu/backend/tobe

      # connect to ec2 instance
      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            rm -rf /home/ubuntu/backend/current
            mkdir /home/ubuntu/backend/current
            cp /home/ubuntu/backend/tobe/project.jar /home/ubuntu/backend/current/project.jar
            cd /home/ubuntu/backend/current
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar project.jar > ./output.log 2>&1 &
            rm -rf /home/ubuntu/backend/tobe
